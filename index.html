<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go Piscine · Учебная платформа</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1a1a'/%3E%3Ctext x='4' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%239969ff'%3E01%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="learn.css">
  <link rel="stylesheet" href="extra.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">01</a>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <nav class="nav-links" style="display:flex;gap:6px;margin-right:10px">
      <a class="nav-pill" href="#/arena" style="text-decoration:none;font:600 12px var(--mono);padding:4px 10px;border-radius:4px;background:rgba(153,105,255,0.12);border:1px solid var(--accent);color:var(--accent-l)">⚡ <span id="navArena">Арена</span></a>
      <a class="nav-pill" href="#/setup" style="text-decoration:none;font:600 12px var(--mono);padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--text)">💻 <span id="navSetup">Setup</span></a>
    </nav>
    <span class="tools">
      <div class="lang-switch" id="langSwitch" style="display:inline-flex;border:1px solid var(--line);border-radius:14px;background:#141318;padding:2px;gap:2px;vertical-align:middle">
        <button id="langRu" type="button" title="Русский язык" style="padding:2px 7px;font:700 11px var(--mono);border-radius:12px;border:none;cursor:pointer;background:transparent;color:var(--muted)">RU</button>
        <button id="langKz" type="button" title="Қазақ тілі" style="padding:2px 7px;font:700 11px var(--mono);border-radius:12px;border:none;cursor:pointer;background:transparent;color:var(--muted)">KZ</button>
      </div>
      <button id="fsm" title="Мельче шрифт" aria-label="Мельче шрифт">A−</button>
      <button id="fsp" title="Крупнее шрифт" aria-label="Крупнее шрифт">A+</button>
      <button id="theme" title="Светлая / тёмная тема" aria-label="Сменить тему">◐</button>
    </span>
    <span class="xp" id="xp" hidden></span>
    <span class="user" id="user" hidden></span>
    <button class="link" id="logout" hidden>выйти</button>
  </header>
  <main id="app"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="i18n.js"></script>
  <script src="lessons.js"></script>
  <script src="extra.js"></script>
  <script src="more.js"></script>
  <script src="piscine.js"></script>
  <script src="lessons_kz.js"></script>
  <script src="widgets.js"></script>
  <script src="pedagogy.js"></script>
  <script src="setup.js"></script>
  <script src="arena.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
